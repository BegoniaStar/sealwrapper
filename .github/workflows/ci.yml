name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SEALWRAPPER_CORE_INTEGRATION: "1"
      SEALWRAPPER_REQUIRE_CORE_INTEGRATION: "1"

    steps:
      - name: Check out source
        # v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install offline report renderer prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk librsvg2-bin
          fc-match --format '%{family}\n' 'Noto Serif CJK SC' | grep -Fx 'Noto Serif CJK SC'
          rsvg-convert --version

      - name: Install mise toolchain
        # v2
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654
        with:
          install: true
          cache: true

      - name: Show toolchain
        run: |
          mise --version
          mise exec -- node --version
          mise exec -- npm --version
          mise exec -- go version
          git --version

      - name: Install locked Node dependencies
        run: mise exec -- npm ci

      - name: Full verification gate
        run: mise exec -- npm run check
